name: Generar meme Don Mako

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chapumakos-meme-generator
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install --upgrade openai pillow

      - name: Generar meme
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generar_meme.py

      - name: Commit y push
        run: |
          git config user.name "Chapumakos Bot"
          git config user.email "chapumakos-bot@users.noreply.github.com"
          git add memes/ready memes/history.json
          git diff --cached --quiet && exit 0
          git commit -m "meme: Don Mako automático"
          git push
